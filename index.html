<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  var q = new URLSearchParams(location.search);
  var id = q.get("v");
  var start = parseInt(q.get("start"), 10) || 0;
  var list = q.get("list");

  function watchUrl() {
    var u = "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
    if (start) u += "&t=" + start + "s";
    if (list) u += "&list=" + encodeURIComponent(list);
    return u;
  }

  if (!id || !/^[\w-]{11}$/.test(id)) {
    document.body.style.color = "#fff";
    document.body.style.font = "16px sans-serif";
    document.body.textContent = "No valid video ID in the URL.";
  } else {
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    window.onYouTubeIframeAPIReady = function () {
      var vars = { autoplay: 1, rel: 0, playsinline: 1, start: start };
      if (list) vars.list = list;
      new YT.Player("player", {
        videoId: id,
        host: "https://www.youtube-nocookie.com",
        width: "100%",
        height: "100%",
        playerVars: vars,
        events: {
          onReady: function (e) {
            try { document.title = e.target.getVideoData().title || "Video"; } catch (_) {}
            e.target.playVideo();
          },
          // 100 = removed/private, 101/150 = embedding disabled by uploader
          onError: function (e) {
            if ([100, 101, 150].indexOf(e.data) !== -1) location.replace(watchUrl());
          }
        }
      });
    };
  }
</script>
</body>
</html>
